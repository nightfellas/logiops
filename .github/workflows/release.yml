name: Release & Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Run Automated Test Suite
        run: cargo test --workspace --verbose

      - name: Build Release Binaries
        run: cargo build --release

      - name: Build Frontend UI
        run: |
          cd crates/logi-gui/ui
          npm install
          npm run build

      - name: Package AppDir & AppImage
        run: |
          ./packaging/appimage/build-appimage.sh
          # Download appimagetool if not available
          if [ ! -f LogiOptions-x86_64.AppImage ]; then
            wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
            chmod +x /usr/local/bin/appimagetool
            ARCH=x86_64 appimagetool build/AppDir LogiOptions-x86_64.AppImage
          fi

      - name: Create Tarball Archive
        run: |
          tar -czvf logioptions-linux-x86_64.tar.gz \
            -C target/release logid-service logi-options \
            -C ../../packaging/udev 99-logitech-options.rules \
            -C ../install.sh install.sh

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            LogiOptions-x86_64.AppImage
            logioptions-linux-x86_64.tar.gz

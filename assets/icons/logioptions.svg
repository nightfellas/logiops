<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f232b"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d4352"/>
      <stop offset="50%" stop-color="#2a2e39"/>
      <stop offset="100%" stop-color="#181a20"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#2f3542" stroke-width="6"/>

  <!-- Mouse Contour -->
  <g filter="url(#shadow)">
    <!-- Thumb Wing -->
    <path d="M 170 280 C 120 300, 100 360, 120 410 C 135 445, 175 455, 210 460 Z" fill="#252932" stroke="#3d4352" stroke-width="3"/>
    <!-- Body -->
    <path d="M 260 90 C 330 90, 380 150, 390 250 C 400 350, 375 435, 325 470 C 275 500, 215 480, 185 450 C 150 400, 160 300, 175 230 C 190 160, 215 90, 260 90 Z" fill="url(#bodyGrad)" stroke="#4a5263" stroke-width="4"/>
    <!-- Center Separation Line -->
    <path d="M 260 90 L 260 215" stroke="#181a20" stroke-width="4"/>
    <!-- Scroll Wheel (Teal Accent) -->
    <rect x="246" y="125" width="28" height="70" rx="8" fill="url(#tealGrad)" stroke="#0e1014" stroke-width="2"/>
    <!-- Mode Shift Button -->
    <rect x="251" y="210" width="18" height="22" rx="5" fill="#4a5263" stroke="#252932" stroke-width="2"/>
    <!-- Thumb Wheel -->
    <rect x="135" y="270" width="18" height="46" rx="5" fill="url(#tealGrad)" stroke="#0e1014" stroke-width="2"/>
  </g>

  <!-- Battery & Bolt Badge in Bottom-Right Corner -->
  <g transform="translate(330, 330)" filter="url(#shadow)">
    <circle cx="60" cy="60" r="54" fill="#14171d" stroke="#00f5d4" stroke-width="4"/>
    <!-- Lightning Bolt -->
    <path d="M 64 28 L 44 60 L 58 60 L 52 92 L 76 56 L 62 56 Z" fill="url(#tealGrad)"/>
  </g>
</svg>
